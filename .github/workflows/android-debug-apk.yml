# PHASE 6: GitHub Actions workflow for fast debug APK generation
# Optimized for ~3 minute build time with caching and parallel execution
# FIX: Added Gradle setup to handle missing wrapper JAR

name: Android Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'
        cache-read-only: false

    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Gradle wrapper JAR missing, generating..."
          gradle wrapper --gradle-version 8.2
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: List APK files
      run: |
        echo "=== APK Files ==="
        find . -name "*.apk" -type f
        echo "================="

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CascadeSim-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/mapping/debug/*.txt
        retention-days: 14
        if-no-files-found: error

    - name: Upload Build Outputs (Optional)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          **/build/reports/*.html
          **/build/outputs/**/*.log
        retention-days: 3
        if-no-files-found: ignore

    - name: Create Release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        generate_release_notes: true
